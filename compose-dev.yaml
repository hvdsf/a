version: '3.8'

name: pm

services:
  mssqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=K6JqvDt.
    ports:
      - 8082:1433
    volumes:
      - mssqlserver_volume:/var/opt/mssql
    networks:
      - pm_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P K6JqvDt. -Q 'SELECT 1' -C || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s


  mssqlserver-migrations:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      container_name: migrator
      env_file:
      - ./backend/.env.dev
      working_dir: /app
      entrypoint: 
        - /bin/sh
        - -c
        - |
          dotnet tool install --global dotnet-ef
          dotnet restore
          /root/.dotnet/tools/dotnet-ef database update
      depends_on:
        mssqlserver:
          condition: service_healthy
      networks:
        - pm_network
      volumes:
        - ./backend:/app:z
        - /app/obj
        - /app/bin

  backend:
    build:
      context: ./backend
      dockerfile: containers/Containerfile.dev
    container_name: backend
    env_file:
      - ./backend/.env.dev
    ports:
      - "8081:5122"
    depends_on:
      mssqlserver-migrations:
        condition: service_completed_successfully
    networks:
      - pm_network
    volumes:
      - ./backend:/app:z
      - /app/obj
      - /app/bin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget http://localhost:5122/api/health -O /dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: containers/Containerfile.dev
    container_name: frontend
    ports:
      - "8080:4200"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pm_network
    volumes:
      - ./frontend:/app:Z

networks:
  pm_network:
    driver: bridge
    name: pm_network

volumes:
  mssqlserver_volume:
    name: mssqlserver_volume